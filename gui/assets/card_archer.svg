  <rect x="8" y="132" width="44" height="40" fill="#1a1410" stroke="#c9a14a" stroke-width="1"/>
  <text x="30" y="156" fill="#e8c97a" font-family="Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle">Archer</text>
