<svg xmlns="http://www.w3.org/2000/svg" width="60" height="180" viewBox="0 0 60 180">
  <!-- frame -->
  <rect x="2" y="2" width="56" height="176" rx="4" fill="#2a2018" stroke="#7a5e2c" stroke-width="2"/>
  <rect x="5" y="5" width="50" height="170" rx="3" fill="none" stroke="#c9a14a" stroke-width="1" opacity="0.7"/>
  <!-- portrait area -->
  <rect x="8" y="8" width="44" height="120" fill="#3a4a5a" stroke="#5a6a7a" stroke-width="1"/>
  <!-- knight portrait: helm + shoulders -->
  <rect x="20" y="38" width="20" height="26" rx="4" fill="#8a8a90" stroke="#4a4a50" stroke-width="1.5"/>
  <rect x="22" y="48" width="16" height="4" fill="#2a2a30"/>
  <rect x="22" y="56" width="16" height="4" fill="#2a2a30"/>
  <!-- plume -->
  <path d="M30 38 C 28 28, 32 22, 36 26 C 34 30, 34 34, 30 38 Z" fill="#c0392b"/>
  <!-- shoulders -->
  <path d="M12 80 Q20 64 30 64 Q40 64 48 80 L48 100 L12 100 Z" fill="#5a6a7a" stroke="#3a4a5a" stroke-width="1.5"/>
  <!-- name plate -->
  <rect x="8" y="132" width="44" height="40" fill="#1a1410" stroke="#c9a14a" stroke-width="1"/>
  <text x="30" y="156" fill="#e8c97a" font-family="Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle">Knight</text>
</svg>
